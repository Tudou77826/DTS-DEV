services:
  mysql:
    image: mysql:8.0
    container_name: dts-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: dts
      MYSQL_USER: dts
      MYSQL_PASSWORD: dts123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - dts-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dts-mysql-data:
