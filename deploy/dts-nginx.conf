server {
    listen 18082;
    server_name _;

    root /opt/dts/frontend-dist;
    index index.html;
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ─── 统一认证（OAuth）对接 ───
    # 生产环境应由外层的 OAuth 认证代理（如 oauth2-proxy、Keycloak 网关等）完成登录，
    # 并在代理到本服务前注入用户身份头，同时剥离客户端伪造的同名头：
    #   proxy_set_header X-Auth-User          $oauth_username;
    #   proxy_set_header X-Auth-Display-Name  $oauth_display_name;
    #   proxy_set_header X-Auth-Email         $oauth_email;
    # 后端通过 app.oauth.header.* 读取这些头建立登录态；首次登录自动建档为普通提出人。
    # 注意：本示例不包含认证代理，接入时请在网关注入头并设置 DTS_OAUTH_HEADER_ENABLED=true。

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
