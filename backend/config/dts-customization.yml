dts:
  customization:
    profile:
      id: default-dev-team
      name: 默认研发团队接入配置
      target-team: 网络安全组
      target-system: DTS
    branding:
      product-name: 问题管理平台
      short-name: DTS
      login-title: 登录
      login-subtitle: 使用账号密码登录系统
      primary-color: '#2563eb'
      show-demo-accounts: true
      demo-account-hint: 演示环境默认密码为 123456
    terminology:
      issue: 问题
      product: 来源产品
      module: 所属模块
      version: 发现版本
      domain: 问题领域
      submitter: 提出人
      assignee: 责任人
    roles:
    - value: SUBMITTER
      label: 问题提出人
      color: null
    - value: DEVELOPER
      label: 开发人员
      color: null
    - value: LEADER
      label: 项目负责人
      color: null
    admin:
      password-hash: $2a$10$iUw9X7Ll0/TJPXYI7TCXoeOmS3S5kJgu5K05WJecIT3HYI/eAIsdK
    issue:
      code:
        prefix: ISS
        date-pattern: yyMMdd
        sequence-digits: 3
      default-priority: MEDIUM
      priorities:
      - value: LOW
        label: 低
        color: neutral
      - value: MEDIUM
        label: 中
        color: blue
      - value: HIGH
        label: 高
        color: orange
      - value: URGENT
        label: 紧急
        color: red
      statuses:
      - value: PENDING_ASSIGN
        label: 待分配
        color: neutral
      - value: PROCESSING
        label: 处理中
        color: blue
      - value: PENDING_VERIFY
        label: 待验证
        color: violet
      - value: RESOLVED
        label: 已解决
        color: green
      - value: CLOSED
        label: 已关闭
        color: neutral
      fields:
        title:
          label: 问题标题
          placeholder: 用一句话概括问题，例如：策略下发后设备配置未生效
          required: true
          visible: true
        description:
          label: 问题描述
          placeholder: 详细描述问题现象、复现步骤、日志与上下文…
          required: true
          visible: true
        module:
          label: 所属模块
          placeholder: 选择模块
          required: true
          visible: true
        product:
          label: 来源产品
          placeholder: 输入产品名称，例如 HiSec
          required: false
          visible: true
        domain:
          label: 问题领域
          placeholder: 选择领域
          required: false
          visible: true
        foundVersion:
          label: 发现版本
          placeholder: 选择版本号
          required: false
          visible: true
        priority:
          label: 优先级
          placeholder: null
          required: false
          visible: true
        vpnInfo:
          label: VPN 信息
          placeholder: VPN 连接信息
          required: true
          visible: true
        expectedFinishAt:
          label: 期望解决时间
          placeholder: null
          required: false
          visible: true
        subModule:
          label: 子模块
          placeholder: 如 PL团队（可选）
          required: false
          visible: true
        envInfo:
          label: 环境信息
          placeholder: 操作系统、硬件、组网、配置等环境信息
          required: false
          visible: true
      transitions:
        PENDING_ASSIGN:
        - PROCESSING
        PROCESSING:
        - PENDING_VERIFY
        - PROCESSING
        PENDING_VERIFY:
        - RESOLVED
        - PROCESSING
        RESOLVED:
        - CLOSED
        - PROCESSING
        CLOSED:
        - PROCESSING
    master-data:
      sync-mode: merge
      teams:
      - key: network-security
        name: 网络安全组
        description: 问题排查与定位团队
      users:
      - employee-no: L0001
        username: leader
        display-name: 张项目负责人
        role: LEADER
        team: network-security
        avatar-color: '#0ea5e9'
        active: true
      - employee-no: D1001
        username: wangwu
        display-name: 王五
        role: DEVELOPER
        team: network-security
        avatar-color: '#10b981'
        active: true
      - employee-no: D1002
        username: zhaoliu
        display-name: 赵六
        role: DEVELOPER
        team: network-security
        avatar-color: '#f59e0b'
        active: true
      - employee-no: D1003
        username: sunqi
        display-name: 孙七
        role: DEVELOPER
        team: network-security
        avatar-color: '#ec4899'
        active: true
      modules:
      - 入侵检测
      - 流量清洗
      - 日志审计
      - 策略下发
      products:
      - 态势感知
      - 边界安全
      - 日志审计平台
      versions:
      - V500R020C10
      - V500R020C20
      - V600R001C00
      domains:
      - name: 功能缺陷
        description: null
      - name: 性能问题
        description: null
      - name: 兼容性
        description: null
      - name: 配置问题
        description: null
      - name: 安全漏洞
        description: null
    features:
      attachments: true
      relations: true
      notifications: true
      batch-operations: true
      excel-export: true
      rich-text: true
    extensions: {
      }
