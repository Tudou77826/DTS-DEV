spring:
  datasource:
    url: jdbc:sqlite:./dts-dev.db
    driver-class-name: org.sqlite.JDBC
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 1   # SQLite 写并发受限
  # SQLite 用 Flyway 的通用脚本（建表），关闭 MySQL 专用迁移
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration-sqlite

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.dts: DEBUG

app:
  storage:
    root: ./target/uploads-sqlite
