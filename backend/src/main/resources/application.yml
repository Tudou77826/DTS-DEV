server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: dts-backend
  config:
    import:
      - optional:classpath:dts-customization.yml
      - optional:file:./config/dts-customization.yml

  datasource:
    url: jdbc:mysql://localhost:3306/dts?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: dts
    password: dts123
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Flyway 建表与迁移（替代 JPA ddl-auto）
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: null
      id-type: auto

# 认证
app:
  customization:
    external-file: ./config/dts-customization.yml
  auth:
    # 本地账号密码登录开关（开发模式默认开启；生产接入统一认证后应通过
    # DTS_AUTH_LOCAL_ENABLED=false 关闭）
    local:
      enabled: ${DTS_AUTH_LOCAL_ENABLED:true}
  oauth:
    header:
      # 信任反向代理（OAuth 认证网关）注入的用户头。启用后网关必须注入用户名头并剥离外部伪造的同名头。
      enabled: ${DTS_OAUTH_HEADER_ENABLED:false}
      username-header: ${DTS_OAUTH_USERNAME_HEADER:X-Auth-User}
      display-name-header: ${DTS_OAUTH_DISPLAY_NAME_HEADER:X-Auth-Display-Name}
      email-header: ${DTS_OAUTH_EMAIL_HEADER:X-Auth-Email}
      employee-no-header: ${DTS_OAUTH_EMPLOYEE_NO_HEADER:X-Auth-Employee-No}
  admin-token:
    # 接入定制共享密码门禁签发的管理员令牌有效期
    expiration-ms: 1800000   # 30min
  bootstrap:
    # 仅用于首次创建配置文件中的账号；已有账号密码不会在重启时被覆盖。
    default-user-password: ${DTS_BOOTSTRAP_DEFAULT_PASSWORD:123456}
  storage:
    root: ./uploads
  jwt:
    secret: dts-dev-secret-key-please-change-in-production-environment-very-long-32bytes
    expiration-ms: 86400000   # 24h
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.dts: DEBUG
    com.dts.mapper: DEBUG
