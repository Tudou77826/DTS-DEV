server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: dts-backend
  config:
    import:
      - optional:classpath:dts-customization.yml
      - optional:file:./config/dts-customization.yml

  datasource:
    url: jdbc:mysql://localhost:3306/dts?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: dts
    password: dts123
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Flyway 建表与迁移（替代 JPA ddl-auto）
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: null
      id-type: auto

# 认证
app:
  ai-location:
    enabled: ${APP_AI_LOCATION_ENABLED:false}
    url: ${APP_AI_LOCATION_URL:http://127.0.0.1:8091}
    key: ${APP_AI_LOCATION_KEY:local-dev-ai-key}
  customization:
    external-file: ./config/dts-customization.yml
  auth:
    # 本地账号密码登录开关（开发模式默认开启；生产接入统一认证后应通过
    # DTS_AUTH_LOCAL_ENABLED=false 关闭，仅作非内网环境兜底）
    local:
      enabled: ${DTS_AUTH_LOCAL_ENABLED:true}
  sso:
    # 是否启用公司统一身份源（W3/W3X）认证。启用后应用主动调 W3X 取用户身份，
    # 成功后换发本系统 JWT；本地账号密码登录仍可通过上面的开关保留为兜底。
    # 内网部署方接手时：填入真实 URL / cookie 名后置为 true 即可生效。
    enabled: ${DTS_SSO_ENABLED:false}
    # W3X「按 cookie 取用户信息」接口（GET）。占位，请替换为真实地址。
    user-info-url: ${DTS_SSO_USER_INFO_URL:https://w3x.example.com/api/user}
    # W3 登录页地址，前端在 SSO 会话失效（401）时外跳至此，并附回跳参数。
    login-page-url: ${DTS_SSO_LOGIN_PAGE_URL:https://w3.example.com/login}
    # W3 登录页识别的回跳参数名。
    redirect-param: ${DTS_SSO_REDIRECT_PARAM:redirect}
    # W3 登录成功后回跳 URL 中携带 SSO 凭证的参数名（跨域场景前端从此参数取凭证换 token）。
    credential-param: ${DTS_SSO_CREDENTIAL_PARAM:token}
    # SSO 会话 cookie 的名称（仅同域场景 SsoAuthFilter 自动读取浏览器 cookie 时使用）。
    cookie-name: ${DTS_SSO_COOKIE_NAME:W3_TOKEN}
    connect-timeout-ms: ${DTS_SSO_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${DTS_SSO_READ_TIMEOUT_MS:5000}
  admin-token:
    # 接入定制共享密码门禁签发的管理员令牌有效期
    expiration-ms: 1800000   # 30min
  bootstrap:
    # 仅用于首次创建配置文件中的账号；已有账号密码不会在重启时被覆盖。
    default-user-password: ${DTS_BOOTSTRAP_DEFAULT_PASSWORD:123456}
  storage:
    root: ./uploads
  jwt:
    # 生产必须通过 DTS_JWT_SECRET 注入随机密钥（openssl rand -hex 32）；
    # 下方默认值仅用于本地开发，切勿在生产环境使用。
    secret: ${DTS_JWT_SECRET:dts-dev-secret-key-please-change-in-production-environment-very-long-32bytes}
    expiration-ms: 86400000   # 24h
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}

springdoc:
  api-docs:
    # 生产通过 SPRINGDOC_ENABLED=false 关闭 API 文档
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html

logging:
  level:
    com.dts: DEBUG
    com.dts.mapper: DEBUG
