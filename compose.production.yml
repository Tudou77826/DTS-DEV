services:
  backend:
    build:
      context: ./backend
    container_name: dts-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: sqlite
      SPRING_DATASOURCE_URL: jdbc:sqlite:/data/dts.db
      APP_CUSTOMIZATION_EXTERNAL_FILE: /data/config/dts-customization.yml
      APP_STORAGE_ROOT: /data/uploads
      DTS_JWT_SECRET: ${DTS_JWT_SECRET:?DTS_JWT_SECRET must be set}
      DTS_BOOTSTRAP_DEFAULT_PASSWORD: ${DTS_BOOTSTRAP_DEFAULT_PASSWORD:-123456}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:18082}
      # 生产默认关闭 API 文档
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-false}
      # 生产默认禁用本地账号密码登录。接入统一认证（反向代理注入用户头）时：
      # DTS_AUTH_LOCAL_ENABLED=false
      # DTS_OAUTH_HEADER_ENABLED=true
      DTS_AUTH_LOCAL_ENABLED: ${DTS_AUTH_LOCAL_ENABLED:-false}
      DTS_OAUTH_HEADER_ENABLED: ${DTS_OAUTH_HEADER_ENABLED:-false}
      DTS_OAUTH_USERNAME_HEADER: ${DTS_OAUTH_USERNAME_HEADER:-X-Auth-User}
      DTS_OAUTH_DISPLAY_NAME_HEADER: ${DTS_OAUTH_DISPLAY_NAME_HEADER:-X-Auth-Display-Name}
      DTS_OAUTH_EMAIL_HEADER: ${DTS_OAUTH_EMAIL_HEADER:-X-Auth-Email}
      DTS_OAUTH_EMPLOYEE_NO_HEADER: ${DTS_OAUTH_EMPLOYEE_NO_HEADER:-X-Auth-Employee-No}
    volumes:
      - dts-data:/data
    networks:
      - dts
    deploy:
      resources:
        limits:
          memory: 768M

  frontend:
    build:
      context: ./frontend
    container_name: dts-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "18082:80"
    networks:
      - dts
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  dts:

volumes:
  dts-data:
